name: Android CI

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:
  pull_request:
    branches: [ "master" ]

run-name: ${{ github.event_name == 'schedule' && 'Nightly' || github.event_name == 'workflow_dispatch' && 'Manual' || 'PR' }} build #${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Get current commit info
        id: commit-info
        run: |
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "subject=$(git log -1 --pretty=%s)" >> $GITHUB_OUTPUT

      # ---- 魔法核心：由 GitHub 服务器自动生成一个临时签名文件 ----
      - name: Generate temporary keystore
        run: |
          keytool -genkey -v -keystore $RUNNER_TEMP/temp.jks -alias key0 -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=Test"

      # ---- 编译 Release 正式版 (体积小)，并自动使用上面的临时签名 ----
      - name: Build Release APK
        env:
          ZTOOL_RELEASE_STORE_FILE: ${{ runner.temp }}/temp.jks
          ZTOOL_RELEASE_STORE_PASSWORD: password
          ZTOOL_RELEASE_KEY_ALIAS: key0
          ZTOOL_RELEASE_KEY_PASSWORD: password
        run: ./gradlew assembleRelease

      # ---- 上传打包好的小体积安装包 ----
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ZTool-Release-Tested-${{ steps.commit-info.outputs.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
